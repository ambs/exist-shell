name: ty

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Run ty
        id: ty
        continue-on-error: true
        run: uv run ty check src/ 2>&1 | tee ty.log
      - name: Build PR comment
        if: github.event_name == 'pull_request'
        run: |
          status="${{ steps.ty.outcome }}"
          if [[ "$status" == "success" ]]; then
            echo "## 🔎 ty — ✅ No errors" > comment.md
          else
            count=$(grep -cE "^error\[" ty.log 2>/dev/null || echo 0)
            {
              echo "## 🔎 ty — ❌ ${count} error(s)"
              echo ""
              echo '```'
              cat ty.log
              echo '```'
            } > comment.md
          fi
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        if: github.event_name == 'pull_request'
        with:
          header: ty
          path: comment.md
      - name: Propagate failure
        if: steps.ty.outcome == 'failure'
        run: exit 1
