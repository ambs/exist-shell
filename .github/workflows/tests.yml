name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: uv run pytest --cov=exist_shell --cov-report=xml --cov-report=term 2>&1 | tee pytest.log
      - name: Build PR comment
        if: github.event_name == 'pull_request'
        run: |
          status="${{ steps.pytest.outcome }}"
          [[ "$status" == "success" ]] && icon="✅ Passed" || icon="❌ Failed"
          test_line=$(grep -oE "[0-9]+ (passed|failed|error(s)?)[^,=]*" pytest.log | tr '\n' ', ' | sed 's/, $//' || echo "—")
          coverage=$(grep "^TOTAL" pytest.log | awk '{print $NF}' || echo "—")
          {
            echo "## 🧪 Tests — ${icon}"
            echo ""
            echo "**${test_line}**  "
            echo "**Coverage: ${coverage}**"
          } > comment.md
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        if: github.event_name == 'pull_request'
        with:
          header: tests
          path: comment.md
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Propagate failure
        if: steps.pytest.outcome == 'failure'
        run: exit 1
