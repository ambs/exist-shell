name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      flags: ${{ steps.list.outputs.flags }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image matrix from --list-images
        id: list
        run: |
          flags=$(bash scripts/e2e.sh --list-images \
            | awk '/^\s+--/{print $1}' \
            | jq -R . | jq -sc .)
          echo "flags=${flags}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flag: ${{ fromJson(needs.matrix.outputs.flags) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run e2e tests (${{ matrix.flag }})
        id: run
        continue-on-error: true
        run: bash scripts/e2e.sh ${{ matrix.flag }} 2>&1 | tee e2e.log
      - name: Save result artifact
        if: always()
        run: |
          flag="${{ matrix.flag }}"
          slug="${flag#--}"
          image=$(grep "^Using image:" e2e.log | awk '{print $3}' || echo "$flag")
          summary=$(grep -E "[0-9]+ passed, [0-9]+ failed" e2e.log | tail -1 | xargs || echo "no summary")
          printf '%s\n%s\n%s\n' "${{ steps.run.outcome }}" "${image}" "${summary}" \
            > "result-${slug}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-result-${{ matrix.flag }}
          path: result-*.txt

  post-comment:
    needs: [e2e]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-result-*
          merge-multiple: true
      - name: Build PR comment
        run: |
          {
            echo "## 🐋 e2e Tests"
            echo ""
            echo "| Image | Result | Tests |"
            echo "|-------|--------|-------|"
            for f in result-*.txt; do
              [[ -f "$f" ]] || continue
              mapfile -t lines < "$f"
              status="${lines[0]}"
              image="${lines[1]}"
              summary="${lines[2]}"
              [[ "$status" == "success" ]] && icon="✅" || icon="❌"
              echo "| \`${image}\` | ${icon} | ${summary} |"
            done
          } > comment.md
          cat comment.md
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: e2e
          path: comment.md
