name: Ruff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: uv run ruff check src/ 2>&1 | tee ruff.log
      - name: Build PR comment
        if: github.event_name == 'pull_request'
        run: |
          status="${{ steps.ruff.outcome }}"
          if [[ "$status" == "success" ]]; then
            echo "## 🔍 Ruff — ✅ No issues" > comment.md
          else
            count=$(grep -cE "\.py:[0-9]" ruff.log 2>/dev/null || echo 0)
            {
              echo "## 🔍 Ruff — ❌ ${count} violation(s)"
              echo ""
              echo '```'
              cat ruff.log
              echo '```'
            } > comment.md
          fi
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        if: github.event_name == 'pull_request'
        with:
          header: ruff
          path: comment.md
      - name: Propagate failure
        if: steps.ruff.outcome == 'failure'
        run: exit 1
