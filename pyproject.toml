[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exist-shell"
version = "0.1.0"
description = "Command-line tool to interact with eXist-db via REST"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "tomlkit>=0.15.0",
    "platformdirs>=4; sys_platform == 'win32'",
]

[project.scripts]
exsh = "exist_shell.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/exist_shell"]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "ruff>=0.9",
    "ty>=0.0.0a1",
]
